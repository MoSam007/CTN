; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;   Please visit documentation for the other options and examples
;   https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LittleFS configuration
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; Library dependencies
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.0
    bblanchon/ArduinoJson@^7.4.3
    me-no-dev/ESPAsyncWebServer@^3.0.0
    me-no-dev/ESPAsyncTCP@^1.2.0

; Build flags for Phase 2 features
build_flags =
    ${common.build_flags}
    -DCTN_DEMO_MODE=1
    -DCTN_WEBSOCKET_ENABLED=1
    -DCTN_OTA_ENABLED=1
    -DCTN_BATTERY_SIMULATOR=1

; Extra scripts
extra_scripts = pre_build.py

; Upload options
upload_protocol = esptool

; Monitor options
monitor_encoding = utf-8

; Build options
build_type = debug

[env:nodemcuv2-release]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.0
    bblanchon/ArduinoJson@^7.4.3
    me-no-dev/ESPAsyncWebServer@^3.0.0
    me-no-dev/ESPAsyncTCP@^1.2.0

build_flags =
    ${common.build_flags}
    -DCTN_DEMO_MODE=1
    -DCTN_WEBSOCKET_ENABLED=1
    -DCTN_OTA_ENABLED=1
    -DCTN_BATTERY_SIMULATOR=1
    -DNDEBUG

upload_protocol = esptool

[common]
build_flags =
    -DFW_VERSION=\"1.2.0\"
    -DDEVICE_NAME=\"CTN-001\"
    -DDEBUG_MODE=1
    -DDEBUG_LEVEL=3